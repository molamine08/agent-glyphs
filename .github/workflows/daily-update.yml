name: Daily index update

# Every day: pull the newest Iconify release + approved external libraries,
# measure only what changed, rebuild atlas.db and publish it as a release.
on:
  schedule:
    - cron: "23 3 * * *"   # 03:23 UTC daily
  # a change to how icons are measured or labelled rebuilds the index right away
  # (update.py notices the new analyzer / labels version; otherwise it stops early)
  push:
    branches: [main]
    paths: ["scripts/atlas/analyze.py", "scripts/atlas/classify.py", "scripts/atlas/build_index.py",
            "scripts/atlas/build_metrics.py", "scripts/update.py", ".github/workflows/daily-update.yml"]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: index-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Raw measurements are cached between runs so only changed sets are re-measured.
      - name: Restore measurements
        uses: actions/cache/restore@v4
        with:
          path: data/metrics
          key: metrics-${{ github.run_id }}
          restore-keys: metrics-

      # What the vision model saw (written by vision.yml); used as category votes.
      - name: Restore vision results
        uses: actions/cache/restore@v4
        with:
          path: data/vision
          key: vision-none
          restore-keys: vision-

      - name: Update index
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update.py ${{ inputs.force && '--force' || '' }}

      - name: Save measurements
        if: steps.update.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/metrics
          key: metrics-${{ github.run_id }}

      - name: Test the new index
        if: steps.update.outputs.changed == 'true'
        run: python -m unittest discover -s tests -v

      - name: Commit changelog & state
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name  "agent-glyphs-bot"
          git config user.email "agent-glyphs-bot@users.noreply.github.com"
          git add CHANGELOG.md state.json
          git commit -m "data: ${{ steps.update.outputs.tag }}" || { echo "nothing to commit"; exit 0; }
          # the branch may have moved while this job ran: replay our commit on top.
          # CHANGELOG.md and state.json are generated by this run, so on a clash
          # this run's version wins ("theirs" is the commit being replayed)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

      - name: Publish release
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.update.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # a second build on the same day (e.g. after a vision change): replace its files
            gh release upload "$tag" data/atlas.db.gz data/external-sets.json.gz --clobber
            gh release edit "$tag" --notes-file .work/release-notes.md --latest
          else
            gh release create "$tag" data/atlas.db.gz data/external-sets.json.gz \
              --title "Index $tag" --notes-file .work/release-notes.md --latest
          fi
          # keep the last 14 data releases
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^data-' | tail -n +15 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
