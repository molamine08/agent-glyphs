name: Vision categories

# An open image-text model (CLIP, no API key) looks at every icon and votes on
# its content category. Step 1 measures on reviewer-graded icons whether
# those votes help, and sets their weight (0 = not used). Step 2 looks at all
# icons; long first runs continue the next day. Then the index is rebuilt.
on:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: vision
  cancel-in-progress: false

jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (CPU-only PyTorch + open_clip)
        run: |
          pip install -r requirements.txt
          # torch and torchvision must come from the same (CPU) build, or
          # torchvision's compiled operators fail to load at import time
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch
          python -c "import torch, torchvision, open_clip; print('torch', torch.__version__, '| torchvision', torchvision.__version__, '| open_clip', open_clip.__version__)"

      - name: Restore vision results
        uses: actions/cache/restore@v4
        with:
          path: data/vision
          key: vision-${{ github.run_id }}
          restore-keys: vision-

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-vit-b-32-laion2b

      - name: Get icon sources
        run: python -c "from pathlib import Path; import sys; sys.path.insert(0,'scripts'); import update; print(update.fetch_iconify(Path('.work/iconify')))"

      - name: Measure whether vision helps (reviewer-graded icons)
        run: |
          set -o pipefail
          mkdir -p .work
          if ! python tests/eval_vision.py --src .work/iconify --apply 2>&1 | tee .work/eval.log; then
            { echo "### Vision evaluation failed"; echo '```'; tail -n 40 .work/eval.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat VISION_EVAL.md >> "$GITHUB_STEP_SUMMARY"

      - name: Look at every icon
        run: python -m atlas.vision build --src .work/iconify --out data/vision --hours 4.3

      - name: Save vision results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/vision
          key: vision-${{ github.run_id }}

      - name: Commit evaluation
        run: |
          git config user.name  "agent-glyphs-bot"
          git config user.email "agent-glyphs-bot@users.noreply.github.com"
          git add VISION_EVAL.md config.json
          git commit -m "vision: $(tail -n 1 VISION_EVAL.md | cut -c1-120)" || { echo "nothing to commit"; exit 0; }
          # the branch may have moved while this job ran: replay our commit on top
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

      - name: Rebuild the index with the new votes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run daily-update.yml
