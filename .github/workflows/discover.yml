name: Discover new icon libraries

# Every day: look for open icon libraries that are not indexed yet and open a
# pull request proposing them. Nothing is added until a maintainer approves.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download current index (to know what is already covered)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download --pattern atlas.db.gz --dir data || true
          [ -f data/atlas.db.gz ] && gunzip -f data/atlas.db.gz || true

      - name: Search
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover.py

      - name: Open review pull request
        if: steps.discover.outputs.found != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="discover/$(date +%F)"
          git config user.name  "icon-atlas-bot"
          git config user.email "icon-atlas-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add sources/
          git commit -m "Propose new icon libraries ($(date +%F))"
          git push -u origin "$branch"
          gh pr create --title "New icon libraries to review ($(date +%F))" \
            --body-file .work/discover.md --label "new-library" || \
          gh pr create --title "New icon libraries to review ($(date +%F))" --body-file .work/discover.md

      - name: Remember what was already checked
        if: steps.discover.outputs.found == '0'
        run: |
          git config user.name  "icon-atlas-bot"
          git config user.email "icon-atlas-bot@users.noreply.github.com"
          git add sources/seen.json
          git commit -m "discover: nothing new" || exit 0
          # the branch may have moved while this job ran: replay our commit on top
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
