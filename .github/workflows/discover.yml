name: Discover new icon libraries

# Every day: look for open icon libraries that are not indexed yet.
# Auto-add mode (config.json → "discover_auto_add": true): libraries whose
# licence allows commercial use and that pass the checks are added, an issue
# reports them, and the index update starts. Review mode (false): a pull
# request proposes them and nothing is added until it is merged.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download current index (to know what is already covered)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download --pattern atlas.db.gz --dir data || true
          [ -f data/atlas.db.gz ] && gunzip -f data/atlas.db.gz || true

      - name: Search
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover.py

      - name: Configure git
        run: |
          git config user.name  "agent-glyphs-bot"
          git config user.email "agent-glyphs-bot@users.noreply.github.com"

      - name: Add, report and re-index (auto-add mode)
        if: steps.discover.outputs.found != '0' && steps.discover.outputs.auto == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add sources/
          git commit -m "Add new icon libraries ($(date +%F))"
          ok=0
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }
            sleep 10
          done
          [ "$ok" = 1 ] || exit 1
          gh label create new-library --color 0D70FF --description "Libraries added by the discovery bot" 2>/dev/null || true
          gh issue create --title "New icon libraries added ($(date +%F))" \
            --body-file .work/discover.md --label new-library --assignee "${{ github.repository_owner }}" || \
          gh issue create --title "New icon libraries added ($(date +%F))" --body-file .work/discover.md
          gh workflow run daily-update.yml

      - name: Open review pull request (review mode)
        if: steps.discover.outputs.found != '0' && steps.discover.outputs.auto != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="discover/$(date +%F)"
          git switch -c "$branch"
          git add sources/
          git commit -m "Propose new icon libraries ($(date +%F))"
          git push -u origin "$branch"
          gh pr create --title "New icon libraries to review ($(date +%F))" \
            --body-file .work/discover.md --label "new-library" || \
          gh pr create --title "New icon libraries to review ($(date +%F))" --body-file .work/discover.md

      - name: Remember what was already checked
        if: steps.discover.outputs.found == '0'
        run: |
          git add sources/seen.json
          git commit -m "discover: nothing new" || exit 0
          # the branch may have moved while this job ran: replay our commit on top
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
